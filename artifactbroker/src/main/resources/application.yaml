server:
  port: 9014
logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      rename:
        traceId: trace_id
        spanId: span_id
spring:
  main:
    banner-mode: "off"
  application:
    name: multicloud-artifactbroker
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    export:
      enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${COLLECTOR_HOST:http://jaeger-collector.istio-config}:${COLLECTOR_PORT:4317}
          transport: grpc
  otlp:
    metrics:
      # micrometer-registry-otlp comes with spring-boot-starter-opentelemetry and would otherwise push
      # metrics to localhost:4318; metrics are scraped from /actuator/prometheus.
      export:
        enabled: false
